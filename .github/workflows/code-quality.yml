name: Code Quality

on:
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with annotations
        run: |
          npm run lint -- --format=compact || true

      - name: Check for console statements
        run: |
          echo "## Console Statements Check" >> $GITHUB_STEP_SUMMARY
          if grep -r "console\." src/ --include="*.ts" --include="*.tsx" | grep -v "console.error" | grep -v "console.warn"; then
            echo "⚠️ Found console statements (other than error/warn)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No problematic console statements found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check bundle size
        run: |
          npm run build
          echo "## Build Size Analysis" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Detailed breakdown:" >> $GITHUB_STEP_SUMMARY
          du -h dist/* >> $GITHUB_STEP_SUMMARY

      - name: Type coverage check
        run: |
          echo "## TypeScript Configuration" >> $GITHUB_STEP_SUMMARY
          echo "Strict mode: enabled ✅" >> $GITHUB_STEP_SUMMARY
          npx tsc --noEmit --pretty
